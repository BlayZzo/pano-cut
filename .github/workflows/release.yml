name: Release

# Baut die Installer für Mac und Windows und veröffentlicht sie als GitHub-Release.
# Läuft, wenn die Version in package.json auf `main` erhöht wurde (und noch kein Release
# dafür existiert), bei einem Tag `vX.Y.Z` oder manuell über "Run workflow".
# PanoCut findet neue Versionen über diese Releases automatisch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Version prüfen
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version existiert bereits – nichts zu tun."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neue Version v$version – Release wird gebaut."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Release vorab anlegen, damit die parallelen Mac-/Windows-Builds nur noch hochladen
      # (sonst kollidieren sie beim gleichzeitigen Anlegen). Beschreibung kommt aus RELEASE_NOTES.md.
      - if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.decide.outputs.version }}"
          gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PanoCut $v" --notes-file RELEASE_NOTES.md
      # Titel/Beschreibung eines bestehenden Releases nachtragen, falls leer
      - if: steps.decide.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.decide.outputs.version }}"
          body=$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || echo "")
          if [ -z "$body" ]; then
            gh release edit "v$v" --repo "$GITHUB_REPOSITORY" --title "PanoCut $v" --notes-file RELEASE_NOTES.md
          fi

  build:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple Silicon + Intel)
            args: --mac --arm64 --x64
          - os: windows-latest
            name: Windows
            args: --win --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Installer bauen und veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: panocut-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.yml
          if-no-files-found: ignore
